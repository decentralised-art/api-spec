# SPDX-License-Identifier: MIT

title: AuthRequest
type: object
additionalProperties: false
required: [address, nonce, signature]
description: Auth request.

properties:
  address: { $ref: ../../../../shared/schemas/address.yaml }

  nonce:
    type: string
    pattern: "^[0-9a-f]{66}$"
    description: The nonce `/nonce` issued to `address`.

  signature:
    type: string
    description: >
      The wallet's `personal_sign` (EIP-191) signature of the `message`
      issued with `nonce`, as 65-byte hex.
