title: PrepareRequest
type: object
required: [name]
description: Prepare the publication of an entity the caller created on this server.

properties:
  name:
    $ref: "../../../../shared/schemas/entityName.yaml"

  relay:
    type: boolean
    default: false
    description: >
      Also return `signing`, what an offline signer needs to complete the
      transaction for POST /publish/{kind}/send. Leave unset for a browser
      wallet, which chooses its own nonce and fees.
