# SPDX-License-Identifier: MIT

title: ConfirmRequest
type: object
required: [name, content_hash, tx_hash]
description: Confirm a publication transaction the owner's wallet sent.

properties:
  name:
    $ref: "../../../../shared/schemas/entityName.yaml"

  content_hash:
    $ref: "hash32.yaml"

  tx_hash:
    type: string
    pattern: '^(0x)?[a-fA-F0-9]{64}$'
    description: Hash of the sent publication transaction.
