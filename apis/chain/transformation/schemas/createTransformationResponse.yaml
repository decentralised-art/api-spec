# SPDX-License-Identifier: MIT

title: CreateTransformationResponse
type: object
additionalProperties: false
required: [name, owner, address, args_count]
description: Create transformation response

properties:
  name:
    type: string
    description: Name of the created transformation

  owner:
    $ref: "../../../../shared/schemas/address.yaml"

  address:
    type: string
    description: Always "0x0"; the entity is local until published through /publish/transformation.

  args_count:
    type: integer
    minimum: 0
    maximum: 4294967295
    description: Number of arguments (uint32) parsed from the Solidity source.
