# SPDX-License-Identifier: MIT

title: CreateConnectorRequest
type: object
additionalProperties: false
required: [name, dimensions]
description: Connector create request payload.

properties:
  name:
    $ref: "../../../../shared/schemas/entityName.yaml"

  dimensions:
    type: array
    minItems: 1
    items:
      $ref: "connectorDimension.yaml"
    description: Ordered dimension definitions.

  condition_name:
    type: string
    description: Condition name. Omitted or empty string means no condition.

  condition_args:
    type: array
    items:
      type: integer
      format: int32
    description: Condition arguments. Omitted means no condition arguments.

  static_ri:
    type: object
    additionalProperties:
      $ref: "runningInstance.yaml"
    description: >
      Optional static running-instance map. Keys are canonical decimal
      positions (for example "0", "3", "5").
