# SPDX-License-Identifier: MIT

title: ConfirmResponse
type: object
additionalProperties: false
required: [status, kind, name, tx_hash, block_number, address, owner, content_hash]
description: >
  The transaction was mined with status 1 and carries exactly one matching
  registry event naming the entity, owner, content and metadata hashes.

properties:
  status:
    type: string
    enum: [mined]

  kind: { $ref: "entityKind.yaml" }

  name: { $ref: "../../../shared/schemas/entityName.yaml" }

  tx_hash:
    type: string

  block_number:
    type: integer
    format: int64
    minimum: 0

  address:
    $ref: "../../../shared/schemas/address.yaml"

  owner:
    $ref: "../../../shared/schemas/address.yaml"

  content_hash: { $ref: "hash32.yaml" }
